[project]
name = "scamallscope"
version = "0.1.0"
description = "Map an AWS estate: read-only collectors, inventory and graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35"]

[project.scripts]
scamallscope = "scamallscope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,ec2,sts]>=5",
    "pyright>=1.1.414",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["scamallscope", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741"]  # `l` for a link in comprehensions

[tool.ruff.lint.per-file-ignores]
# _detail(errors, name, lambda: ...) runs the lambda at once, inside the same loop turn.
"scamallscope/collectors/s3.py" = ["B023"]
"scamallscope/collectors/lambda_.py" = ["B023"]

[tool.ruff.lint.isort]
known-local-folder = ["estate", "estate_b", "fakehttp", "helpers"]
